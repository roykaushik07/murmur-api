app = "murmur-api"
primary_region = "lhr"

[build]
  image = "ghcr.io/roykaushik07/murmur-api:latest"

[env]
  PORT = "8080"
  CORS_ORIGINS = "https://murmurclips.app"
  TRANSCRIBER_URL = "https://murmur-transcriber.onrender.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
